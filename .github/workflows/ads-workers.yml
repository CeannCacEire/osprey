# Deploys the /ads back end (Cloudflare Workers + D1 + Queues).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Optional secrets: REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, TOKEN_ENC_KEY, ADMIN_SETUP_TOKEN.
# Optional repository variable: REDDIT_USERNAME (used in the Reddit User-Agent).
name: Deploy /ads workers

on:
  push:
    branches: [main]
    paths:
      - "workers/osprey-ads/**"
      - "ads/assets/content.js"
      - ".github/workflows/ads-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ads-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/osprey-ads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping /ads worker deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Install and test
        if: steps.creds.outputs.ok == 'true'
        run: |
          npm ci
          npm test

      - name: D1 database
        if: steps.creds.outputs.ok == 'true'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="osprey-ads") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create osprey-ads
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="osprey-ads") | .uuid')
          fi
          [ -n "$id" ] || { echo "Could not find or create D1 database osprey-ads"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.api.toml wrangler.watcher.toml wrangler.submitter.toml
          npx wrangler d1 migrations apply osprey-ads --remote -c wrangler.api.toml

      - name: Queues
        if: steps.creds.outputs.ok == 'true'
        run: |
          existing=$(npx wrangler queues list 2>/dev/null || true)
          for q in osprey-ads-submissions osprey-ads-submissions-dlq; do
            echo "$existing" | grep -qw "$q" || npx wrangler queues create "$q"
          done

      - name: Deploy workers
        if: steps.creds.outputs.ok == 'true'
        env:
          REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
        run: |
          for w in api watcher submitter; do
            npx wrangler deploy -c wrangler.$w.toml --var "REDDIT_USERNAME:${REDDIT_USERNAME:-}"
          done

      - name: Push secrets
        if: steps.creds.outputs.ok == 'true'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          ADMIN_SETUP_TOKEN: ${{ secrets.ADMIN_SETUP_TOKEN }}
        run: |
          put() { # worker, name
            val="${!2}"
            if [ -n "$val" ]; then printf '%s' "$val" | npx wrangler secret put "$2" -c "wrangler.$1.toml" >/dev/null && echo "set $2 on $1"; fi
          }
          for w in api watcher submitter; do
            put $w REDDIT_CLIENT_ID; put $w REDDIT_CLIENT_SECRET; put $w TOKEN_ENC_KEY
          done
          put api ADMIN_SETUP_TOKEN
