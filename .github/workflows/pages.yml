# Builds and deploys https://osprey.build on every push to main.
# - The main site (index.html, in-depth/, css/, assets/ ...) is copied as-is.
# - The wiki (wiki-src/, Astro Starlight) is built and placed at /wiki/.
# Wiki edits saved in Sveltia CMS (osprey.build/wiki/admin/) are commits to
# main, so they trigger this workflow and go live in a minute or two.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wiki-src/package-lock.json

      - name: Build wiki
        working-directory: wiki-src
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude 'wiki-src' --exclude '_site' --exclude 'workers'
          cp -r wiki-src/dist _site/wiki

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
