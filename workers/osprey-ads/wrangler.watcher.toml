# osprey-ads-watcher: cron job that scans watched subreddits and stores candidates. Never posts.
name = "osprey-ads-watcher"
main = "src/watcher.js"
compatibility_date = "2026-05-01"
workers_dev = false

[vars]
REDDIT_USERNAME = ""
WATCHERS_PER_RUN = "5"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "osprey-ads"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
